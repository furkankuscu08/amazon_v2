# WorkBot hosted demo: Caddy (TLS) -> app -> Qdrant, on one server with an instance role.
# Run from the repository root, with the server's .env there:
#
#   docker compose -f deploy/compose.yaml --env-file .env up -d --build
#   docker compose -f deploy/compose.yaml --env-file .env run --rm app python -m workbot.seed
#
# Only Caddy publishes ports. The app and Qdrant are reachable on the compose network alone.

name: workbot-hosted

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      WORKBOT_DB_PATH: /data/workbot.sqlite3
    # Trusting any forwarder is safe only because nothing but Caddy can reach this port.
    command:
      - uvicorn
      - workbot.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --log-config=deploy/logging.json
    volumes:
      - workbot_data:/data
      - ./logging.json:/app/deploy/logging.json:ro
    depends_on:
      - qdrant

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WORKBOT_HOSTNAME: ${WORKBOT_HOSTNAME:?set WORKBOT_HOSTNAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  qdrant_data:
  workbot_data:
  caddy_data:
  caddy_config:
