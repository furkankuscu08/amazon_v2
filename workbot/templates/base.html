<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}WorkBot · simulated Alexa+ experience{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23743b63'/%3E%3C/svg%3E"><style>
:root{--bg:#f6f3f4;--surface:#fff;--fg:#28232d;--muted:#625b66;--line:#e6dfe4;--accent:#743b63;--accent-soft:#f3e8ef;--accent-ink:#5e2e50;--warn:#855014;--warn-bg:#fbf3e8;--warn-line:#e8cfa8;--field-line:#8a818d;--screen:#241d29;--screen-2:#30273a;--screen-ink:#f7f1f5;--screen-muted:#cdbfca;--glow:#d39bc1;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg)}
a{color:var(--accent)}a:hover{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}h1{font-size:1.6rem;letter-spacing:-.01em}h2{font-size:1.15rem}h3{font-size:1.02rem}h4{font-size:1rem}
p{margin:0}
.wrap{max-width:46rem;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.stack{display:grid;gap:1.5rem}.tight{gap:.6rem}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;padding-block:.85rem}
.mark{font-weight:780;font-size:1.15rem;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.mark i{display:inline-block;width:.42em;height:.42em;margin-left:.12em;border-radius:2px;background:var(--accent)}
.busy .mark i{animation:blink 1.1s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
.sim{margin-left:auto;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem}
main .wrap{padding-block:2rem 3rem}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}footer .wrap{padding-block:1.1rem 2rem}
small,.muted{color:var(--muted)}.small{font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.25rem}
.idea{display:grid;gap:.15rem}.idea q{font-size:1.05rem;quotes:none}
.label{font-size:.75rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
button,.btn{display:inline-block;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:.6rem 1.1rem;cursor:pointer;text-decoration:none}
button.quiet,.btn.quiet{background:transparent;color:var(--accent)}
label{font-weight:600}
textarea{display:block;width:100%;min-height:6rem;margin-top:.35rem;font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--field-line);border-radius:10px;padding:.7rem .8rem;resize:vertical}
textarea::placeholder{color:var(--muted);opacity:1}
input[type=password]{display:block;width:100%;max-width:22rem;margin-top:.35rem;font:inherit;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--field-line);border-radius:10px;padding:.6rem .8rem}
.toggle{display:inline-flex;align-items:center;gap:.45rem;font-weight:500;font-size:.9rem;color:var(--muted)}.toggle input{width:1rem;height:1rem;margin:0;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chips button{font-size:.85rem;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border-color:transparent;border-radius:999px;padding:.2rem .7rem}
ul.plain{list-style:none;margin:0;padding:0}
ul.recent{padding:.3rem 1.25rem}.recent li{padding:.7rem 0;border-top:1px solid var(--line)}.recent li:first-child{border-top:0}
.warning{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:1rem 1.15rem}
.warning h2,.warning strong{color:var(--warn)}
.speak{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;padding:.3rem .8rem}.speak svg{width:1rem;height:1rem;fill:currentColor}
.speak.recording{background:var(--accent);color:#fff}.speak.recording svg{animation:blink 1.1s ease-in-out infinite}
.listen{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;padding:.3rem .85rem .3rem .65rem;border-radius:999px}
.listen svg{width:.95rem;height:.95rem;fill:currentColor}.listen .i-stop,.speaking .listen .i-play{display:none}.speaking .listen .i-stop{display:block}
.screen{display:grid;gap:.6rem;background:linear-gradient(160deg,var(--screen),var(--screen-2));color:var(--screen-ink);border-radius:18px;padding:1.3rem 1.4rem}
.screen-top{display:flex;align-items:center;gap:.6rem}
.screen-label{font-size:.75rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--screen-muted)}
.orb{flex:none;width:.8rem;height:.8rem;border-radius:50%;background:var(--glow);box-shadow:0 0 0 4px rgba(211,155,193,.18)}
.speaking .orb{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(211,155,193,.05)}}
.screen .listen{margin-left:auto;background:var(--screen-ink);color:var(--screen);border-color:var(--screen-ink)}
.screen :focus-visible{outline-color:var(--glow)}
.screen h1{font-size:1.6rem;color:var(--screen-ink)}.screen h1.question{font-size:1.3rem;max-width:58ch}
.screen-sub{color:var(--screen-muted);font-size:1.02rem;max-width:58ch}.screen-sub:empty{margin-top:-.6rem}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ask{display:grid;gap:.25rem;background:var(--accent-soft);padding:1rem 1.2rem}.ask .label{color:var(--accent)}
.ppl{list-style:none;margin:0;padding:0}
.p{display:grid;grid-template-columns:2.5rem minmax(0,1fr);gap:.2rem .85rem;padding:1rem 1.2rem}.p+.p{border-top:1px solid var(--line)}
.av{grid-row:span 3;width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.p .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.25rem .75rem;min-width:0}
.team{display:block;font-size:.85rem;font-weight:400;color:var(--muted)}
.ev{font-size:.9rem;color:var(--muted)}
.badge{flex:none;font-size:.75rem;font-weight:650;white-space:nowrap;border-radius:6px;padding:.12rem .5rem;background:var(--accent);color:#fff;border:1px solid var(--accent)}
.badge.advisor{background:transparent;color:var(--muted);border-color:var(--line)}
.badge.routing_contact{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.ended{font-size:.85rem;color:var(--warn)}.ended::before{content:"";display:inline-block;width:.5rem;height:.5rem;margin-right:.4rem;border-radius:50%;background:var(--warn)}
.shared{display:grid;gap:.3rem}
.caution{font-size:.88rem;color:var(--muted)}
details.all{border-top:1px solid var(--line);padding-top:1rem}
details>summary{cursor:pointer;font-weight:650}summary :is(h2,h3){display:inline;font:inherit}
.areas{display:grid;gap:.6rem;margin-top:1rem}
details.area{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.85rem 1.1rem}
details.area>summary span{font-weight:400;font-size:.85rem;color:var(--muted)}
.areabody{display:grid;gap:.9rem;margin-top:.8rem}
.who{display:grid;gap:.45rem;border-top:1px solid var(--line);padding-top:.85rem}
.who .head{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.who ul{margin:0;padding-left:1.1rem;display:grid;gap:.3rem;font-size:.92rem}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.steps li{display:flex;gap:.6rem;align-items:baseline}
.steps li::before{content:"";flex:none;width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--line);transform:translateY(.1rem)}
.steps li.done{color:var(--muted)}.steps li.done::before{background:var(--accent);border-color:var(--accent)}
.steps li.now{font-weight:600}.steps li.now::before{border-color:var(--accent);border-right-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:translateY(.1rem) rotate(360deg)}}
blockquote{margin:0;border-left:3px solid var(--line);padding:.2rem 0 .2rem 1rem}
pre{margin:0;overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem}
@media (max-width:30rem){h1,.screen h1{font-size:1.35rem}.sim{margin-left:0}.ask,.p{padding-inline:1rem}.screen{padding:1.1rem 1rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head><body class="{% block body_class %}{% endblock %}">
<header class="top"><div class="wrap"><a class="mark" href="/">WorkBot<i aria-hidden="true"></i></a><span class="sim">Simulation · synthetic company data</span></div></header>
<main><div class="wrap" id="page">{% block body %}{% endblock %}</div></main>
<footer><div class="wrap">Independent web simulation of an Alexa+ experience. All people and records are fictional. Not an official Alexa or Amazon integration.</div></footer>
{% include "_script.html" %}
</body></html>
