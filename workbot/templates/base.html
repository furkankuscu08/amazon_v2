<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Workbot · simulated Alexa+ experience{% endblock %}</title><style>
:root{--ink:#16202e;--muted:#5b6675;--line:#dfe4ea;--accent:#0b7c8c;--soft:#e8f4f6;--warn:#ae7620}
body{font:16px/1.55 system-ui,sans-serif;max-width:880px;margin:0 auto;padding:0 1.2rem 3rem;color:var(--ink);background:#f4f6f8}
header.top{display:flex;align-items:center;gap:.7rem;padding:1.1rem 0;border-bottom:1px solid var(--line);margin-bottom:1.4rem}
.ring{width:1.5rem;height:1.5rem;border-radius:50%;border:.28rem solid var(--accent);box-sizing:border-box;flex:none}
header.top strong{font-size:1.05rem}header.top small{margin-left:auto;text-align:right}
.turn{display:flex;gap:.7rem;margin:1rem 0}.turn.user{justify-content:flex-end}
.bubble{background:white;border:1px solid var(--line);border-radius:14px;padding:.9rem 1.1rem;max-width:100%}
.turn.user .bubble{background:var(--soft);border-color:#c9e3e7;max-width:80%}.turn .ring{margin-top:.9rem}
.who{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.15rem}
.bubble h2{font-size:1.25rem;margin:.1rem 0 .6rem}.bubble h3{margin:0;font-size:1.05rem}
.card{flex:1;min-width:0}.badge{display:inline-block;background:var(--soft);color:#075b67;padding:.1rem .5rem;border-radius:4px;font-size:.8rem;font-weight:600;vertical-align:middle}
.warning{border-left:4px solid var(--warn);padding-left:.9rem}.note{color:#7a4f0c}
ol.people{padding-left:1.4rem;margin:.4rem 0}ol.people li{margin:.9rem 0}ol.people p{margin:.25rem 0}
section.person,p.person{border-top:1px solid var(--line);padding:.8rem 0}p.person{margin:0}
details.all>summary{cursor:pointer;font-weight:600}details.all article{border-top:1px solid var(--line);padding:1rem 0}
ul.steps{list-style:none;padding-left:0}ul.steps li{padding:.25rem 0}ul.steps li.done{color:var(--muted)}ul.steps li.done::before{content:'✓  '}ul.steps li.now{font-weight:600}ul.steps li.now::before{content:'…  '}
ul.recent{list-style:none;padding-left:0}ul.recent li{padding:.45rem 0;border-top:1px solid var(--line)}
button{background:var(--accent);color:white;border:0;border-radius:8px;padding:.65rem 1.1rem;font:inherit;cursor:pointer}button.quiet{background:white;color:var(--accent);border:1px solid var(--accent)}
textarea{width:100%;box-sizing:border-box;min-height:5.5rem;font:inherit;padding:.7rem;border:1px solid var(--line);border-radius:10px}
a{color:var(--accent)}small{color:var(--muted)}ul{padding-left:1.4rem}blockquote{border-left:4px solid var(--line);margin-left:0;padding-left:1rem}
</style></head><body>
<header class="top"><span class="ring"></span><strong><a href="/" style="color:inherit;text-decoration:none">Workbot</a></strong>
<small>Simulated Alexa+ experience · synthetic company data<br>Not an official Alexa or Amazon integration</small></header>
{% block body %}{% endblock %}
</body></html>
